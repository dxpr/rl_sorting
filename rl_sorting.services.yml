services:
  rl_sorting.experiment_registration:
    class: Drupal\rl_sorting\Service\ExperimentRegistrationService
    arguments: ['@rl.experiment_registry']

  rl_sorting.experiment_decorator:
    class: Drupal\rl_sorting\Decorator\RlSortingExperimentDecorator
    arguments: ['@entity_type.manager']
    tags:
      - { name: rl_experiment_decorator }

  Drupal\rl_sorting\Hook\RlSortingHooks:
    class: Drupal\rl_sorting\Hook\RlSortingHooks
    autowire: true
    arguments:
      - '@extension.list.module'
      - '@entity_type.manager'
      - '@request_stack'
